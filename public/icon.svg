<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#090d16"/>
  <circle cx="256" cy="256" r="210" stroke="#1e293b" stroke-width="8"/>
  <defs>
    <linearGradient id="grad" x1="60" y1="60" x2="450" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb" />
      <stop offset="0.5" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Video Meet Camera & Graduation Cap Fusion -->
  <g filter="url(#glow)">
    <rect x="130" y="180" width="170" height="152" rx="28" fill="url(#grad)" />
    <polygon points="310,210 390,165 390,347 310,302" fill="url(#grad)" />
    <!-- Cap top -->
    <path d="M215 120 L295 155 L215 190 L135 155 Z" fill="#60a5fa"/>
    <path d="M295 155 L295 195" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="295" cy="198" r="6" fill="#38bdf8"/>
  </g>
</svg>
